<!doctype html>
<meta charset="utf-8" />
<title>Auto Radar</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 320px; margin: 0; padding: 14px;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; flex: none; }
  .dot.ok { background: #16a34a; }
  .dot.bad { background: #dc2626; }
  label { display: block; margin: 8px 0 3px; font-size: 11px; opacity: .7; text-transform: uppercase; letter-spacing: .04em; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #0002; border-radius: 6px; background: transparent; color: inherit; font: inherit; }
  .row { display: flex; gap: 6px; margin-top: 12px; }
  button { flex: 1; padding: 7px 8px; border: 1px solid #0002; border-radius: 6px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  table { width: 100%; margin-top: 12px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 2px 0; }
  td:last-child { text-align: right; font-weight: 600; }
  .muted { opacity: .6; }
  #msg, #crawl-msg { margin-top: 10px; font-size: 12px; min-height: 1.4em; }
  #msg.err, #crawl-msg.err { color: #dc2626; }

  hr { border: 0; border-top: 1px solid #0002; margin: 16px 0 12px; }
  .crawl-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .crawl-head strong { font-size: 13px; }
  .switch { display: flex; align-items: center; gap: 5px; font-size: 12px; opacity: .8;
            text-transform: none; letter-spacing: 0; margin: 0; cursor: pointer; }
  .switch input { width: auto; }
  .hint { font-size: 11.5px; opacity: .6; margin: 4px 0 2px; line-height: 1.4; }
  textarea {
    width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #0002;
    border-radius: 6px; background: transparent; color: inherit;
    font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
</style>

<h1><span class="dot" id="dot"></span> Auto Radar</h1>

<label for="serverUrl">Server</label>
<input id="serverUrl" type="text" spellcheck="false" placeholder="http://127.0.0.1:8787" />

<label for="token">Token</label>
<input id="token" type="password" spellcheck="false" placeholder="iz server/token.txt" />

<table>
  <tr><td class="muted">Oglasa u bazi</td><td id="s-listings">—</td></tr>
  <tr><td class="muted">Snimaka cena</td><td id="s-snapshots">—</td></tr>
  <tr><td class="muted">Promena cene</td><td id="s-changes">—</td></tr>
  <tr><td class="muted">Čeka u redu</td><td id="s-queued">—</td></tr>
</table>

<div class="row">
  <button id="scan" class="primary">Skeniraj stranicu</button>
  <button id="debug">Kopiraj debug</button>
</div>

<div id="msg"></div>

<hr />

<div class="crawl-head">
  <strong>Automatsko skupljanje</strong>
  <label class="switch"><input type="checkbox" id="crawl-enabled" /> uključeno</label>
</div>
<p class="hint">Otvara tvoje pretrage u pozadinskom tabu, jednu po jednu. Radi samo dok je Chrome upaljen.</p>

<label for="seeds">Pretrage (jedan URL po redu)</label>
<textarea id="seeds" rows="4" spellcheck="false"
  placeholder="https://www.polovniautomobili.com/auto-oglasi/pretraga?brand=volkswagen&model%5B%5D=golf-7"></textarea>

<div class="grid2">
  <div>
    <label for="interval">Pauza (min)</label>
    <input id="interval" type="number" min="1" max="120" step="1" />
  </div>
  <div>
    <label for="cap">Max strana / dan</label>
    <input id="cap" type="number" min="1" max="2000" step="10" />
  </div>
</div>

<table>
  <tr><td class="muted">U redu za obilazak</td><td id="c-frontier">—</td></tr>
  <tr><td class="muted">Danas obiđeno</td><td id="c-today">—</td></tr>
  <tr><td class="muted">Sledeće</td><td id="c-next">—</td></tr>
</table>

<div class="row">
  <button id="crawl-save" class="primary">Sačuvaj</button>
  <button id="crawl-reset">Resetuj red</button>
</div>

<div id="crawl-msg"></div>

<script src="popup.js"></script>
